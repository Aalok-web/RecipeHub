<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeHub - Forgot Password</title>

  <style>
    /* Basic page layout and background. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7ed;
      font-family: Arial, sans-serif;
    }

    /* Password recovery card. */
    .reset-card {
      width: 90%;
      max-width: 420px;
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      color: #f97316;
      text-align: center;
    }

    h2 {
      color: #333333;
      text-align: center;
    }

    p {
      color: #666666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ea580c;
    }

    .back-link {
      margin-top: 20px;
      text-align: center;
    }

    a {
      color: #ea580c;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
<div class="reset-card">
  <h1>RecipeHub</h1>
  <h2>Forgot Password?</h2>

  <p>
    Enter your registered email address to begin recovering
    access to your account.
  </p>

  <!-- Frontend form; backend password recovery will be connected next. -->
  <form action="forgot-password" method="post">
    <label for="email">Registered Email</label>

    <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
    >

    <button type="submit">Reset Password</button>
  </form>

  <p class="back-link">
    Remember your password?
    <a href="login.html">Back to Login</a>
  </p>
</div>
</body>
</html>
