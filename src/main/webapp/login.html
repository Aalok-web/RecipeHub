<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeHub - Login</title>

  <style>
    /* Apply consistent sizing to all elements. */
    * {
      box-sizing: border-box;
    }

    /* Center the login card on the page. */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7ed;
      font-family: Arial, sans-serif;
    }

    /* Login card styling. */
    .login-card {
      width: 90%;
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      color: #f97316;
      text-align: center;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    /* Style form labels and input fields. */
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    /* Make links clearly visible. */
    a {
      color: #ea580c;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Forgot Password link appears above the Login button. */
    .forgot-password {
      display: block;
      margin-top: 14px;
      text-align: right;
      font-size: 14px;
    }

    .forgot-password a {
      display: inline-block;
      padding: 5px 0;
      font-weight: bold;
    }

    /* Style the Login button. */
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ea580c;
    }

    /* Registration link styling. */
    .register {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
<div class="login-card">
  <h1>RecipeHub</h1>
  <h2>Login</h2>

  <!-- Send login credentials to the existing LoginServlet. -->
  <form action="login" method="post">
    <label for="email">Email</label>
    <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
    >

    <label for="password">Password</label>
    <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
    >

    <!-- Link to the password recovery page. -->
    <div class="forgot-password">
      <a href="forgot-password.html">Forgot Password?</a>
    </div>

    <button type="submit">Login</button>
  </form>

  <p class="register">
    Don't have an account?
    <a href="register.html">Register</a>
  </p>
</div>
</body>
</html>
